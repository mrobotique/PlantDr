; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================================
; PlatformIO Configuration File
; Project: ESP32-S3 Dual-Channel Capacitive Soil Moisture System (Dracaena Custom Edition)
; Target Hardware: Waveshare ESP32-S3-Zero / Generic ESP32-S3 Board Module
;
; Configuration Details:
;   - Platform: Espressif 32 (Arduino Framework)
;   - Flash Memory: 4MB Flash (DIO Mode)
;   - PSRAM Memory: 2MB Pseudo-Static RAM (Quad-SPI / QIO Mode)
;   - USB Communications: Native USB-CDC enabled on boot for serial monitoring
; ============================================================================================

[env:esp32s3_zero]
; --- Core Architecture & Framework Selection ---
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- Hardware Memory & Flash Partition Layout ---
; ESP32-S3-Zero integrates 4MB Quad-SPI Flash and 2MB Quad-SPI PSRAM
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_qspi
board_build.partitions = default.csv

; --- Compiler Build Flags & Hardware Directives ---
; - ARDUINO_USB_CDC_ON_BOOT=1: Redirects standard Serial output directly to hardware USB-CDC port
; - ARDUINO_USB_MODE=1: Sets USB operational mode to OTG/CDC
; - DBOARD_HAS_PSRAM: Instructs ESP-IDF / Arduino core to initialize and allocate PSRAM heap
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

; --- External Dependency Management ---
; External C++ libraries required for network clients, local configuration, and hardware drivers:
;   1. adafruit/Adafruit NeoPixel: WS2812 RGB LED data bus driver
;   2. tzapu/WiFiManager: Automatic captive AP portal for network provisioning
;   3. knolleary/PubSubClient: Lightweight MQTT client implementation
lib_deps = 
    adafruit/Adafruit NeoPixel @ ^1.12.0
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8